[project]
name = "anava-backend"
version = "0.1.0"
description = "Anava Clinic backend — FastAPI modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "redis>=5.2",
    "boto3>=1.35",
    "structlog>=24.4",
    "httpx>=0.27",
    "razorpay>=1.4",
    "fpdf2>=2.7",
    "tzdata>=2024.1",

]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()-in-default-arg is the documented idiom

[tool.ruff.lint.per-file-ignores]
# E501 only, scoped to files that are literal severity-band lookup tables
# (threshold, code, label triples/pairs) — wrapping them mid-tuple to fit 140
# makes them harder to read and diff against the source clinical instrument,
# not easier. A global line-length bump instead made `ruff format` want to
# reformat 66 unrelated files across the whole codebase (its wrap/collapse
# decisions are keyed off the same setting), so this is scoped per-file
# rather than global.
"app/modules/prs/scoring_rules.py" = ["E501"]
"app/modules/prs/disease_scoring.py" = ["E501"]
"tests/unit/test_disease_scoring.py" = ["E501"]
"tests/unit/test_scoring_rules.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
