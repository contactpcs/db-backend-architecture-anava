name: Build and push backend image to ECR

on:
  # workflow_run only reads its trigger config from the default branch
  # (main) copy of this file — a device_session_newflow-only edit to the
  # branches list here never takes effect, so CI completing on that branch
  # never fired this workflow and no image was pushed. Triggering on push
  # directly works from any branch, since GitHub evaluates push triggers
  # from the workflow file as it exists on the branch being pushed.
  #
  # That alone would race CI though: push fires both workflows at once, not
  # one after the other. So this workflow now calls CI as a reusable
  # workflow (jobs.ci below) and build-and-push `needs` it — real gate, not
  # two independent triggers that happen to run close together.
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC federation into AWS
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: anava-backend
  ECS_CLUSTER: anava-cluster
  # The ALB-fronted service. The previous value here,
  # anava-backend-service-xzknhp50, was deleted when the load balancer was
  # attached — update-service against it fails with ServiceNotFoundException,
  # so CI would go green while production kept serving the old image.
  ECS_SERVICE: anava-backend-lb

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # main deploys to the new account (api.anavaclinics.com), dev to the
      # old one (stagingapi.anavaclinics.com). Same repo, cluster and service
      # names in both, so only the role and the health URL differ. Any other
      # branch (e.g. a manual run) fails here instead of deploying somewhere.
      - name: Select target AWS account
        run: |
          case "$GITHUB_REF_NAME" in
            main)
              echo "AWS_ROLE_ARN=arn:aws:iam::363518210533:role/github-actions-ecr-push" >> "$GITHUB_ENV"
              echo "HEALTH_URL=https://api.anavaclinics.com/health/version" >> "$GITHUB_ENV"
              ;;
            dev)
              echo "AWS_ROLE_ARN=arn:aws:iam::604275788092:role/github-actions-ecr-push" >> "$GITHUB_ENV"
              echo "HEALTH_URL=https://stagingapi.anavaclinics.com/health/version" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::No deploy target for branch '$GITHUB_REF_NAME' (expected main or dev)"
              exit 1
              ;;
          esac

      - name: Checkout the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      # Proves the deployed image actually contains the code that was built,
      # rather than assuming update-service succeeded. The treatment protocol
      # routes 404'd in production for a full day because a force-new-deployment
      # reused the previous image tag: the service was healthy, the routes were
      # simply not in it. A health check would not have caught that; an
      # OpenAPI check does.
      - name: Verify the new routes are live
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            # /openapi.json is not served in production (app/main.py) —
            # /health/version reports the same path count.
            count=$(curl -fsS --max-time 20 "$HEALTH_URL" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('paths',0))" || echo 0)
            if [ "$count" -gt 150 ]; then
              echo "OK: $count paths served"
              exit 0
            fi
            echo "attempt $attempt: only $count paths, waiting for tasks to cut over"
            sleep 15
          done
          echo "FAILED: deployed image is serving $count paths — expected >150." >&2
          echo "The service is healthy but running older code. Check that the" >&2
          echo "task definition references the :latest tag just pushed." >&2
          exit 1
