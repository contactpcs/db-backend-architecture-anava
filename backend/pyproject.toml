[project]
name = "anava-backend"
version = "0.1.0"
description = "Anava Clinic backend — FastAPI modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "redis>=5.2",
    "boto3>=1.35",
    "structlog>=24.4",
    "httpx>=0.27",
    "razorpay>=1.4",
    "fpdf2>=2.7",
    "tzdata>=2024.1",

]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 140
target-version = "py312"
# These two are literal severity-band lookup tables (threshold, code, label
# triples/pairs) — `ruff format` wraps each dict/list entry onto its own line
# once it exceeds line-length, which for these specific files means exploding
# a 5-tuple band list into 7 lines apiece, harder to read and harder to diff
# against the source clinical instrument than the original one-line-per-scale
# layout. per-file-ignores only silences the E501 lint rule, not the
# formatter (it has no per-file line-length knob), so these are excluded from
# ruff format entirely and hand-maintained instead — everything else in the
# repo still gets formatted normally.
extend-exclude = ["app/modules/prs/scoring_rules.py", "app/modules/prs/disease_scoring.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()-in-default-arg is the documented idiom

[tool.ruff.lint.per-file-ignores]
# E501 for the two scoring-table test files — they quote the same long
# literal band/weight tables from scoring_rules.py/disease_scoring.py
# (excluded from ruff entirely, see extend-exclude above) in fixtures and
# assertions, so the same "don't fragment the table" reasoning applies here
# even though the test files themselves aren't excluded outright.
"tests/unit/test_disease_scoring.py" = ["E501"]
"tests/unit/test_scoring_rules.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
