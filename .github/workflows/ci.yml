name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ".[dev]"
      - run: mypy app

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    services:
      # POSTGRES_USER here is the bootstrap superuser (stands in for RDS's
      # "postgres" role, i.e. settings.migration_database_url) — matches how
      # SQL/v1/02_roles.sql itself describes the split: anava_app is a
      # separate, less-privileged, RLS-enforced role created explicitly
      # below, never the container's own bootstrap user.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anava_migrate
          POSTGRES_PASSWORD: anava_test_password
          POSTGRES_DB: anava_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anava_migrate -d anava_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      # anava_app: scoped, RLS-enforced — what the app actually runs as.
      DATABASE_URL: postgresql+asyncpg://anava_app:anava_app_test_password@localhost:5432/anava_test
      # anava_migrate (the container's bootstrap superuser): DDL/schema role,
      # same purpose MIGRATION_DATABASE_URL serves against the real RDS.
      MIGRATION_DATABASE_URL: postgresql+asyncpg://anava_migrate:anava_test_password@localhost:5432/anava_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_MODE: local
      LOCAL_JWT_SECRET: ci-test-secret
      FILE_STORAGE_MODE: local
      LOCAL_FILE_STORAGE_PATH: ./.local_storage
      SQS_ENDPOINT_URL: http://localhost:9324
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ".[dev]"
      - name: Provision SQL/v1 schema
        # alembic/versions/0001_baseline_schema.py reads SQL/01_extensions.sql
        # etc. directly off disk at migration-run time (SQL_DIR = .../"SQL").
        # Those files were replaced by SQL/v1/ during the schema restructuring
        # and no longer exist — `alembic upgrade head` cannot succeed as
        # written (FileNotFoundError, not flaky). SQL/v1/*.sql is the real
        # schema source of truth (see SQL/v1/NOTES.md), so CI provisions from
        # there directly instead.
        working-directory: .
        env:
          PGPASSWORD: anava_test_password
        run: |
          set -euo pipefail
          psql -h localhost -U anava_migrate -d anava_test -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anava_app') THEN CREATE ROLE anava_app LOGIN PASSWORD 'anava_app_test_password' NOBYPASSRLS; END IF; END \$\$;"
          for f in $(printf '%s\n' SQL/v1/*.sql | LC_ALL=C sort); do
            base=$(basename "$f")
            [ "$base" = "run_all.sql" ] && continue
            echo "Applying $base"
            if [ "$base" = "19_search_path.sql" ]; then
              # Source file targets the real RDS database name; CI's
              # ephemeral container uses a different one. Substituted only
              # at apply-time — SQL/v1 files are generated source-of-truth,
              # never hand-edited (see each file's own header comment).
              sed 's/"Anava_App_v1"/"anava_test"/' "$f" | psql -h localhost -U anava_migrate -d anava_test -v ON_ERROR_STOP=1
            else
              psql -h localhost -U anava_migrate -d anava_test -v ON_ERROR_STOP=1 -f "$f"
            fi
          done
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: anava-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (deps + IaC)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
